<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>SapinSapin AI — Open AI datasets for Philippine languages</title>
    <meta
      name="description"
      content="SapinSapin AI is a Philippine sovereign-AI initiative building open speech and text datasets for Philippine languages — 513+ hours of speech across 10 languages, free to download and build on."
    />
    <link rel="canonical" href="https://sapinsapin.ai/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SapinSapin AI" />
    <meta property="og:url" content="https://sapinsapin.ai/" />
    <meta property="og:title" content="SapinSapin AI — Open AI datasets for Philippine languages" />
    <meta
      property="og:description"
      content="Open speech and text corpora for Filipino, Cebuano, Ilocano, Bikol, Waray, Hiligaynon, Kapampangan, Pangasinan and Tausug. Built in the open, free to download."
    />
    <meta property="og:image" content="https://sapinsapin.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SapinSapin AI — open AI datasets for Philippine languages, shown over stacked layers in ube violet, pandan green and coconut cream."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SapinSapin AI — Open AI datasets for Philippine languages" />
    <meta
      name="twitter:description"
      content="Open speech and text corpora for Filipino, Cebuano, Ilocano, Bikol, Waray, Hiligaynon, Kapampangan, Pangasinan and Tausug."
    />
    <meta name="twitter:image" content="https://sapinsapin.ai/og.png" />

    <meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme before first paint so the page never flashes the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
